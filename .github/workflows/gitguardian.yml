name: GitGuardian secret scan

# Path-filtered ggshield Action (saves minutes on docs-only PRs).
# The GitGuardian GitHub App check ("GitGuardian Security Checks") remains the
# always-on secret audit when GITGUARDIAN_API_KEY is not configured for Actions.
#
# MUST scan via this workflow when the API key is set and src/, lockfiles,
# .env*, or other non-docs paths change. Pure docs/screenshot PRs are skipped.
on:
  pull_request:
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - 'ARCHITECTURE.md'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'CODE_MAP.md'
      - 'FEATURE_EXTRACTION.md'
      - '**/*.md'
      - '**/*.png'
      - '**/*.jpg'
      - '**/*.jpeg'
      - '**/*.webp'
      - '**/*.gif'
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - 'ARCHITECTURE.md'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'CODE_MAP.md'
      - 'FEATURE_EXTRACTION.md'
      - '**/*.md'
      - '**/*.png'
      - '**/*.jpg'
      - '**/*.jpeg'
      - '**/*.webp'
      - '**/*.gif'
  workflow_dispatch:

concurrency:
  group: gitguardian-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scanning:
    name: GitGuardian scan
    runs-on: ubuntu-latest
    steps:
      # Do not put secrets in job-level `if:` — both arms can skip and the
      # workflow fails with zero jobs. Detect the key inside the job instead.
      - name: Detect GitGuardian API key
        id: gg
        env:
          GITGUARDIAN_API_KEY: ${{ secrets.GITGUARDIAN_API_KEY }}
        run: |
          if [ -n "$GITGUARDIAN_API_KEY" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::GITGUARDIAN_API_KEY is not set — ggshield Action skipped on this run."
            echo "Secret audit on code changes still relies on the GitGuardian GitHub App check."
            echo "Add GITGUARDIAN_API_KEY under repository secrets to enable path-filtered ggshield CI."
          fi

      - name: Checkout
        if: steps.gg.outputs.enabled == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: GitGuardian scan (ggshield)
        if: steps.gg.outputs.enabled == 'true'
        uses: GitGuardian/ggshield/actions/secret@v1.54.0
        env:
          GITHUB_PUSH_BEFORE_SHA: ${{ github.event.before }}
          GITHUB_PUSH_BASE_SHA: ${{ github.event.base }}
          GITHUB_PULL_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GITGUARDIAN_API_KEY: ${{ secrets.GITGUARDIAN_API_KEY }}
