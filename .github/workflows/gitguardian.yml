name: GitGuardian secret scan

# Security scan stays on the critical path for code / lockfile / env changes.
# Pure docs or design-screenshot PRs are skipped (paths-ignore).
on:
  pull_request:
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - 'ARCHITECTURE.md'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'CODE_MAP.md'
      - 'FEATURE_EXTRACTION.md'
      - '**/*.md'
      - '**/*.png'
      - '**/*.jpg'
      - '**/*.jpeg'
      - '**/*.webp'
      - '**/*.gif'
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - 'ARCHITECTURE.md'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'CODE_MAP.md'
      - 'FEATURE_EXTRACTION.md'
      - '**/*.md'
      - '**/*.png'
      - '**/*.jpg'
      - '**/*.jpeg'
      - '**/*.webp'
      - '**/*.gif'
  workflow_dispatch:

concurrency:
  group: gitguardian-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scanning:
    name: GitGuardian scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure GitGuardian API key
        env:
          GITGUARDIAN_API_KEY: ${{ secrets.GITGUARDIAN_API_KEY }}
        run: |
          if [ -z "$GITGUARDIAN_API_KEY" ]; then
            echo "::error::GITGUARDIAN_API_KEY is not configured. Add it under repository secrets so secret scanning stays on the critical path for code changes."
            exit 1
          fi

      - name: GitGuardian scan
        uses: GitGuardian/ggshield/actions/secret@v1.54.0
        env:
          GITHUB_PUSH_BEFORE_SHA: ${{ github.event.before }}
          GITHUB_PUSH_BASE_SHA: ${{ github.event.base }}
          GITHUB_PULL_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GITGUARDIAN_API_KEY: ${{ secrets.GITGUARDIAN_API_KEY }}
